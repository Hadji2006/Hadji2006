name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate stats
        uses: rahul-jha98/github-stats-transparent@latest
        with:
          github_username: Hadji2006

      - name: Commit files
        uses: EndBug/add-and-commit@v9
        with:
          add: "output/generated/*.svg"
          message: "Update stats"
